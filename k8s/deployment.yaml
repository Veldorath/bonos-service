apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonos-service
  labels:
    app: bonos-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bonos-service
  template:
    metadata:
      labels:
        app: bonos-service
    spec:
      containers:
        - name: bonos-service
          # El pipeline reemplaza 877762162499 y us-east-1, o usa 'kubectl set image'
          image: 877762162499.dkr.ecr.us-east-1.amazonaws.com/bonos-service:latest
          ports:
            - containerPort: 8004
          env:
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: casino-secrets, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { secretKeyRef: { name: casino-secrets, key: DB_PORT } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: casino-secrets, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: casino-secrets, key: DB_PASSWORD } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: casino-secrets, key: DB_NAME } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: casino-secrets, key: JWT_SECRET } }
            - name: CORS_ORIGIN
              value: "*"
          readinessProbe:
            httpGet: { path: /readyz, port: 8004 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 8004 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
